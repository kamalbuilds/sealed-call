[package]
name = "cpi_opener"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "cpi_opener"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-idl-build = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "sealed_call/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = "0.32.1"
sealed_call = { path = "../sealed_call", features = ["cpi"] }
