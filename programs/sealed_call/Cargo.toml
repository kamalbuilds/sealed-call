[package]
name = "sealed_call"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sealed_call"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl-build = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
solana-sha256-hasher = "2.3"

[dev-dependencies]
proptest = "1"
